# Read the Docs build. The site executes `docs/tutorial.md` against the real
# Cellimo API, so the build needs the `docs` extra — which carries anndata and
# numpy for exactly that reason — and it fails on any Sphinx warning.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
